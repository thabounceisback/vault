# The Fantasy Vault's theme - a torchlit treasure-hall backdrop with an aged-gold
# accent. Set here (not just in app.py's CSS) so every native Streamlit widget -
# labels, captions, dataframes - gets legible text color instead of falling
# back to the light-theme default.
[theme]
base = "dark"
primaryColor = "#D4AF37"
backgroundColor = "#0B0906"
secondaryBackgroundColor = "#17130D"
textColor = "#F0E6D2"
font = "sans serif"
